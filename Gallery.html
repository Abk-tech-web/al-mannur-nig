<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery - Al-Mannur Nigeria Enterprises</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #f4f4f4;
      color: #333;
    }
    header {
      background: linear-gradient(to right, #7B3F00, #C49E48);
      color: white;
      padding: 2rem;
      text-align: center;
      animation: slideDown 1s ease-in-out;
    }
    @keyframes slideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 1rem;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }
    .gallery img {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }
    footer {
      text-align: center;
      background-color: #222;
      color: white;
      padding: 1rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Gallery</h1>
    <p>Explore our store and products</p>
  </header>

  <main>
    <div class="gallery">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRe7yrvcTgc4LjQ-4deCSfOgYwk9l1oFe7UZg&usqp=CAU" alt="Provision Image 1">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ1ukCeZxrs82tElDpi1gUsQIMA9tFzvOpUZQ&usqp=CAU" alt="Provision Image 2">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQf4YehcL5xIaVYrBAWFT1w5MbPQq0N3OV6xQ&usqp=CAU" alt="Provision Image 3">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRywMkIH9fJQ5ns6lgoQNPz1_nAu3-lED6YNiZL3RnEhX1ZMY746XQuYY6D&s=10" alt="Provision Image 4">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQDEws6KO4RKiBJQ0gjDO6-385lON7bCP6auDHgt59KUXYfI-_1cftnNogL&s=10" alt="Provision Image 5">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTKV2k33-la1428Fn13Uwa9CGgYpCAJnOGd7n7t-12-wwFaoKr5jKaK-b0&s=10" alt="Provision Image 6">

    </div>
  </main>

  <footer>
    <p>&copy; 2025 Al-Mannur Nigeria Enterprises. All rights reserved.</p>
  </footer>
</body>
</html>
